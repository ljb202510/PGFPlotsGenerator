# ============================================================
# PGFPlotsGenerator Java 后端配置
# 支持环境变量覆盖：${ENV_VAR:default}
# 数据库默认值：localhost/root/000/X
# ============================================================
server:
  port: ${PORT:3000}

spring:
  application:
    name: pgfplots-backend
  config:
    # 导入后端环境文件 spring-backend/.env（DB/密钥/SMTP 配置），不放仓库根目录：
    # 根 .env 会被前端 vue-cli 自动加载（PORT/NODE_ENV 会干扰 devServer 与 build）。
    # 两条路径分别对应在 spring-backend / 仓库根 下启动；文件不存在时自动跳过（optional），
    # 回退下方各项默认值。注意：存储目录（app.storage.*）仍默认相对 spring-backend，
    # 推荐以 spring-backend 为工作目录启动（scripts/run.cmd 已处理）。
    import:
      - optional:file:.env[.properties]
      - optional:file:spring-backend/.env[.properties]
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:X}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:000}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  servlet:
    multipart:
      # 与 Node multer limits.fileSize 一致：100MB
      max-file-size: 100MB
      max-request-size: 100MB
  mail:
    host: ${SMTP_HOST:smtp.qq.com}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USER:2771008024@qq.com}
    password: ${SMTP_PASS:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
            port: 465

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
  mapper-locations: classpath*:mapper/**/*.xml

# 应用自定义配置
app:
  # JWT 密钥：缺失即启动失败（fail-fast，与 Node app.js 一致）
  jwt:
    secret: ${JWT_SECRET:}
    # 普通用户 token 有效期（小时）
    user-expire-hours: 24
    # 管理员 token 有效期（天）
    admin-expire-days: 7
  # 文件存储（默认指向共享数据目录 hello/data/，复用历史数据集与编译产物）
  storage:
    uploads: ${UPLOADS_DIR:../data/uploads}
    history: ${HISTORY_DIR:../data/storage/history}
    charts: ${CHARTS_DIR:../data/storage/generated_charts}
    debug: ${DEBUG_DIR:../data/storage/debug}
    # 用于解析 generation_path 相对路径的基准目录（项目根 hello/）
    relative-base: ${RELATIVE_BASE:..}
  latex:
    executable: ${XELATEX:xelatex}
    timeout-ms: ${LATEX_TIMEOUT_MS:30000}
    max-code-length: 50000
    # XeLaTeX 最大并发编译数（批次2/G2：Semaphore 限流，超出排队）
    max-concurrency: ${LATEX_MAX_CONCURRENCY:2}
  # [批次3.6] 编译任务队列容量（第二级限流的排队区）：满载阈值 = maxPoolSize(4) + 该值。
  # 调小可验证「队列满 → 503 + COMPILE_QUEUE_FULL 落库」这条「不静默丢弃」的路径。
  compile:
    queue-capacity: ${COMPILE_QUEUE_CAPACITY:100}
  llm:
    timeout-ms: ${AI_TIMEOUT_MS:45000}
    max-tokens: ${AI_MAX_TOKENS:8192}
    # [批次3.5] 降级链固定优先级：qwen → siliconflow → deepseek。
    # 主通道失败时从其后逐个尝试，到链尾即止（不回绕）；enabled=false 的通道整层跳过，
    # 既不参与接力也不允许被选为主模型。
    deepseek:
      # 当前置 false：账户余额为 0，充值后改回 true 即恢复，无需改代码
      enabled: ${DEEPSEEK_ENABLED:true}
      api-key: ${DEEPSEEK_API_KEY:}
      api-url: ${DEEPSEEK_API_URL:https://api.deepseek.com/v1}
      model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
    qwen:
      enabled: ${QWEN_ENABLED:true}
      api-key: ${NSCC_API_KEY:}
      api-url: ${NSCC_API_URL:https://maas.nscc-cs.cn/external/api/v1}
      model: ${QWEN_MODEL:Qwen3.5}
    # [批次3.5] 硅基流动（OpenAI 兼容）。[v1.2] 原默认 THUDM/glm-4-9b-chat 已被平台下架
    # （调用返回 30003 Model disabled），改用同系列在架的免费模型 THUDM/GLM-4-9B-0414。
    siliconflow:
      enabled: ${SILICONFLOW_ENABLED:true}
      api-key: ${SILICONFLOW_API_KEY:}
      api-url: ${SILICONFLOW_API_URL:https://api.siliconflow.cn/v1}
      model: ${SILICONFLOW_MODEL:THUDM/GLM-4-9B-0414}
  mail:
    from: ${SMTP_FROM:PG Admin <2771008024@qq.com>}
    # 注册验证码有效期（分钟）
    code-expire-minutes: 10
  # RAG 检索增强（批次1/A1）：默认关闭，开启需配置 embedding 并执行 rag_seed / rag_backfill
  rag:
    enabled: ${RAG_ENABLED:false}
    top-k-history: 3
    top-k-template: 2
    min-score: ${RAG_MIN_SCORE:0.55}
    # [v1.4] 历史案例相似度上限：≥ 该值视为「与当前提问几乎相同」而剔除，
    # 避免模型照抄上一次的完整代码（含上一次的错误）形成自我强化循环；模板库不受影响
    max-history-score: ${RAG_MAX_HISTORY_SCORE:0.98}
    timeout-ms: ${RAG_TIMEOUT_MS:3000}
    history-limit: 500
    template-limit: 200
    # [语料治理] 历史分区最低可召回等级：golden | verified | unverified。
    # 默认 verified —— 只有「编译成功 且 静态零违例」的案例参与召回；未定级的天然不召回。
    # 设为 unverified 即等价于「不过滤」，可用于一键回退；模板分区恒不受影响（全为 golden）。
    min-quality: ${RAG_MIN_QUALITY:verified}
  embedding:
    api-key: ${EMBEDDING_API_KEY:}
    api-url: ${EMBEDDING_API_URL:https://api.siliconflow.cn/v1}
    model: ${EMBEDDING_MODEL:BAAI/bge-m3}
    dim: ${EMBEDDING_DIM:1024}

logging:
  charset:
    # 控制台日志按 UTF-8 输出（与脚本 chcp 65001 / Windows Terminal 匹配）。
    # 若必须在 GBK（936）旧式控制台看日志，可改回 GBK 或设环境变量 LOG_CONSOLE_CHARSET=GBK。
    # 仅影响日志输出的控制台编码，文件读写、HTTP 报文等仍保持 UTF-8。
    console: ${LOG_CONSOLE_CHARSET:GBK}
  level:
    com.pg.pgfplots: info
